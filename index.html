<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Polícia Civil - Estado de San Andreas</title>
    <style>
        :root {
            --bg-dark: #0a0f1d;
            --bg-card: #131b2e;
            --bg-card-hover: #1e293b;
            --accent-blue: #3b82f6;
            --accent-gold: #f59e0b;
            --accent-red: #ef4444;
            --accent-green: #10b981;
            --border-subtle: rgba(255, 255, 255, 0.08);
            --text-main: #f1f5f9;
            --text-muted: #94a3b8;
        }

        *, *::before, *::after { box-sizing: border-box; }

        body { 
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; 
            background-color: var(--bg-dark); 
            margin: 0; padding: 0; 
            color: var(--text-main); 
            min-height: 100vh;
            background-image: radial-gradient(circle at 50% 0%, #111c33 0%, var(--bg-dark) 70%);
        }

        #auth-screen {
            display: flex; align-items: center; justify-content: center;
            min-height: 100vh; padding: 20px;
        }
        .box-login {
            max-width: 420px; width: 100%;
            background: var(--bg-card); border: 1px solid var(--border-subtle);
            padding: 40px; border-radius: 14px; text-align: center;
            box-shadow: 0 10px 30px rgba(0,0,0,0.4);
        }
        .box-login h1 { font-size: 20px; margin-bottom: 5px; color: #fff; letter-spacing: 1px; }
        .box-login h2 { font-size: 12px; color: var(--accent-gold); margin-bottom: 25px; letter-spacing: 2px; }
        
        .input-login-group { text-align: left; margin-bottom: 15px; }
        .input-login-group label {
            display: block; font-size: 12px; color: var(--text-muted);
            margin-bottom: 6px; font-weight: 700; text-transform: uppercase;
        }
        .input-login-group input, .input-login-group select {
            width: 100%; background: rgba(15, 23, 42, 0.8);
            border: 1px solid var(--border-subtle); padding: 12px;
            border-radius: 8px; color: #fff; font-size: 14px; outline: none;
        }
        .input-login-group input:focus, .input-login-group select:focus { border-color: var(--accent-blue); }

        .btn-entrar {
            background: var(--accent-blue); color: white; border: none;
            width: 100%; padding: 12px; border-radius: 8px; font-weight: 700;
            font-size: 13.5px; cursor: pointer; margin-top: 10px;
        }
        .btn-entrar:hover { opacity: 0.9; }
        
        .btn-toggle-mode {
            background: transparent; color: var(--text-muted); border: none;
            font-size: 12px; margin-top: 18px; cursor: pointer; text-decoration: underline;
        }
        .btn-toggle-mode:hover { color: #fff; }

        .error-msg { color: var(--accent-red); font-size: 12px; margin-top: 12px; display: none; background: rgba(239, 68, 68, 0.1); padding: 8px; border-radius: 6px; border: 1px solid rgba(239, 68, 68, 0.2); }
        .success-msg { color: var(--accent-green); font-size: 12px; margin-top: 12px; display: none; background: rgba(16, 185, 129, 0.1); padding: 8px; border-radius: 6px; border: 1px solid rgba(16, 185, 129, 0.2); }

        #main-app { display: none; }

        header {
            background: rgba(11, 19, 43, 0.95); backdrop-filter: blur(10px);
            padding: 15px 40px; display: flex; justify-content: space-between;
            align-items: center; border-bottom: 1px solid var(--border-subtle);
            position: sticky; top: 0; z-index: 1000;
        }
        .logo-area { font-weight: 800; font-size: 16px; letter-spacing: 1.5px; cursor: pointer; color: #fff; }
        .nav-links { display: flex; gap: 8px; font-size: 12px; font-weight: 700; align-items: center; }
        .nav-links a { color: var(--text-muted); text-decoration: none; cursor: pointer; padding: 8px 14px; border-radius: 6px; }
        .nav-links a:hover { color: #fff; background: rgba(255, 255, 255, 0.05); }
        .nav-links a.active { color: #fff; background: var(--accent-blue); }

        .wrapper { max-width: 1240px; margin: 35px auto; padding: 0 20px; display: grid; grid-template-columns: 1fr 360px; gap: 30px; }
        .hero-section {
            background: linear-gradient(135deg, rgba(15, 23, 42, 0.85), rgba(11, 19, 43, 0.95));
            border-radius: 14px; padding: 40px; border: 1px solid var(--border-subtle); position: relative;
        }
        .hero-section::before { content: ''; position: absolute; top: 0; left: 0; width: 4px; height: 100%; background: var(--accent-gold); }
        .hero-section h2 { font-size: 13px; margin: 0 0 8px 0; color: var(--accent-gold); letter-spacing: 2px; text-transform: uppercase; }
        .hero-section h1 { font-size: 32px; margin: 0 0 12px 0; font-weight: 800; text-transform: uppercase; }
        .hero-section p { font-size: 14px; color: var(--text-muted); line-height: 1.6; margin-bottom: 25px; }
        
        .sidebar-right { background: var(--bg-card); border-radius: 14px; padding: 24px; border: 1px solid var(--border-subtle); height: fit-content; }
        .sidebar-right h3 { font-size: 12px; color: var(--accent-gold); text-transform: uppercase; border-bottom: 1px solid var(--border-subtle); padding-bottom: 10px; margin-top: 0; }
        
        .admin-panel { margin-top: 25px; border-top: 1px solid var(--border-subtle); padding-top: 20px; display: none; }
        .admin-panel h4 { font-size: 12px; color: var(--accent-blue); text-transform: uppercase; margin-bottom: 15px; }
    </style>
</head>
<body onload="inicializarSistema()">

<div id="auth-screen">
    <div class="box-login">
        <h1>POLÍCIA CIVIL</h1>
        <h2>ESTADO DE SAN ANDREAS</h2>
        
        <div class="input-login-group">
            <label>Usuário</label>
            <input type="text" id="input-user" placeholder="Digite seu usuário">
        </div>
        
        <div class="input-login-group">
            <label>Senha</label>
            <input type="password" id="input-pass" placeholder="••••••••">
        </div>

        <button class="btn-entrar" id="btn-submit-auth" onclick="executarAcaoAuth()">ACESSAR PAINEL</button>
        
        <div id="auth-error" class="error-msg"></div>
        <div id="auth-success" class="success-msg"></div>

        <button class="btn-toggle-mode" id="btn-switch-mode" onclick="alternarModoRegistro()">Não tem uma conta? Crie uma agora</button>
    </div>
</div>

<div id="main-app">
    <header>
        <div class="logo-area">POLÍCIA CIVIL — SAN ANDREAS</div>
        <div class="nav-links">
            <a class="active">INÍCIO</a>
            <a href="https://discord.gg/SEU_DISCORD_AQUI" target="_blank" style="color: #60a5fa;">DISCORD</a>
            <a onclick="sairSistema()" style="color: #ff4757;">SAIR</a>
        </div>
    </header>

    <div class="wrapper">
        <div>
            <div class="hero-section">
                <h2>DEPARTAMENTO DE POLÍCIA CIVIL</h2>
                <h1>INVESTIGAÇÃO, RIGOR E JUSTIÇA</h1>
                <p>Sistema oficial unificado integrado com a planilha de controle online.</p>
            </div>
        </div>
        
        <div class="sidebar-right">
            <h3>Credenciais do Agente</h3>
            <div style="margin: 15px 0;" id="user-status-box"></div>

            <!-- Painel exclusivo para Delegados / Administrativo -->
            <div id="painel-gerenciamento" class="admin-panel">
                <h4>Gerenciar Membros</h4>
                <div class="input-login-group">
                    <label>Pesquisar ou Selecionar Usuário</label>
                    <input type="text" id="admin-search-user" placeholder="Digite para filtrar..." oninput="filtrarUsuariosSelect()">
                    <select id="admin-select-user" size="4" style="margin-top: 6px; height: 90px;" onclick="preencherCargoAlvo()"></select>
                </div>
                
                <div class="input-login-group">
                    <label>Novo Cargo</label>
                    <select id="admin-novo-cargo">
                        <option value="Acadepol">Visitante</option>
                        <option value="Agente">Visitante</option>
                        <option value="Investigador">Visitante</option>
                        <option value="Delegado Adjunto">Delegado Adjunto</option>
                        <option value="Delegado">Delegado</option>
                        <option value="Administrador Geral">Administrador Geral</option>
                    </select>
                </div>

                <div class="input-login-group">
                    <label>Sua Senha (Confirmação)</label>
                    <input type="password" id="admin-confirm-pass" placeholder="Digite sua senha">
                </div>

                <button class="btn-entrar" onclick="salvarAlteracaoCargo()">Salvar Alteração</button>
                <div id="admin-error" class="error-msg"></div>
                <div id="admin-success" class="success-msg"></div>
            </div>
        </div>
    </div>
</div>

<script>
    const GOOGLE_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyXSVN7wlFxF17RCKXnpO9LNCMzPqX4iiEKqErlDaVMFCvvOr4Z-onb9-JPL8ybHrA6Vg/exec";
    
    const DISCORD_CLIENT_ID = "1482774609685119187";
    const REDIRECT_URI = encodeURIComponent(window.location.origin + window.location.pathname);
    let modoRegistro = false;
    let cacheUsuariosGlobal = {};

    async function inicializarSistema() {
        const fragment = new URLSearchParams(window.location.hash.slice(1));
        const token = fragment.get('access_token');
        const usuarioLogado = sessionStorage.getItem('usuario_logado');

        if (usuarioLogado) {
            try {
                const res = await fetch(GOOGLE_SCRIPT_URL);
                cacheUsuariosGlobal = await res.json();
                const dadosUsuario = cacheUsuariosGlobal[usuarioLogado] || { cargo: "Visitante" };

                const discordUser = JSON.parse(sessionStorage.getItem('discord_user') || 'null');
                if (token) {
                    window.history.replaceState({}, document.title, window.location.pathname);
                    fetch('https://discord.com/api/users/@me', { headers: { authorization: `Bearer ${token}` } })
                    .then(res => res.json())
                    .then(dUser => {
                        sessionStorage.setItem('discord_user', JSON.stringify(dUser));
                        liberarPainel(usuarioLogado, dadosUsuario.cargo, dUser);
                    }).catch(() => liberarPainel(usuarioLogado, dadosUsuario.cargo, discordUser));
                } else {
                    liberarPainel(usuarioLogado, dadosUsuario.cargo, discordUser);
                }
            } catch (err) {
                // Fallback se falhar ao buscar dados
                liberarPainel(usuarioLogado, "Visitante", null);
            }
        }
    }

    function alternarModoRegistro() {
        modoRegistro = !modoRegistro;
        document.getElementById('btn-submit-auth').innerText = modoRegistro ? 'CADASTRAR NA PLANILHA' : 'ACESSAR PAINEL';
        document.getElementById('btn-switch-mode').innerText = modoRegistro ? 'Já tem uma conta? Faça login' : 'Não tem uma conta? Crie uma agora';
        document.getElementById('auth-error').style.display = 'none';
        document.getElementById('auth-success').style.display = 'none';
    }

    async function executarAcaoAuth() {
        const user = document.getElementById('input-user').value.trim();
        const pass = document.getElementById('input-pass').value.trim();
        const errorBox = document.getElementById('auth-error');
        const successBox = document.getElementById('auth-success');

        errorBox.style.display = 'none';
        successBox.style.display = 'none';

        if (!user || !pass) {
            errorBox.innerText = "Por favor, preencha usuário e senha.";
            errorBox.style.display = 'block';
            return;
        }

        if (GOOGLE_SCRIPT_URL.includes("COLE_AQUI")) {
            errorBox.innerText = "Erro de configuração: Cole o link do Google Apps Script no código.";
            errorBox.style.display = 'block';
            return;
        }

        if (modoRegistro) {
            successBox.innerText = "Registrando usuário...";
            successBox.style.display = 'block';
            
            try {
                const response = await fetch(GOOGLE_SCRIPT_URL, {
                    method: 'POST',
                    body: JSON.stringify({ action: 'cadastrar', usuario: user, senha: pass })
                });
                const resultado = await response.json();
                
                if (resultado.status === 'sucesso') {
                    successBox.innerText = "Conta criada! Redirecionando para o Discord...";
                    sessionStorage.setItem('usuario_logado', user);
                    setTimeout(() => dispararLoginDiscord(), 1500);
                } else {
                    successBox.style.display = 'none';
                    errorBox.innerText = resultado.mensagem || "Erro ao registrar.";
                    errorBox.style.display = 'block';
                }
            } catch (err) {
                successBox.style.display = 'none';
                errorBox.innerText = "Erro de conexão com a planilha.";
                errorBox.style.display = 'block';
            }
        } else {
            successBox.innerText = "Verificando credenciais...";
            successBox.style.display = 'block';

            try {
                const response = await fetch(GOOGLE_SCRIPT_URL);
                const usuarios = await response.json();

                successBox.style.display = 'none';

                if (usuarios[user] && usuarios[user].senha === pass) {
                    sessionStorage.setItem('usuario_logado', user);
                    dispararLoginDiscord();
                } else {
                    errorBox.innerText = "Usuário ou senha incorretos.";
                    errorBox.style.display = 'block';
                }
            } catch (err) {
                successBox.style.display = 'none';
                errorBox.innerText = "Erro ao acessar planilha.";
                errorBox.style.display = 'block';
            }
        }
    }

    function dispararLoginDiscord() {
        const authUrl = `https://discord.com/oauth2/authorize?client_id=${DISCORD_CLIENT_ID}&response_type=token&redirect_uri=${REDIRECT_URI}&scope=identify`;
        window.location.href = authUrl;
    }

    function liberarPainel(usuario, cargo, discordUser) {
        document.getElementById('auth-screen').style.display = 'none';
        document.getElementById('main-app').style.display = 'block';

        let avatarHtml = `<div style="width: 38px; height: 38px; border-radius: 50%; background: var(--accent-blue); display: flex; align-items: center; justify-content: center; font-weight: bold;">${usuario[0].toUpperCase()}</div>`;
        let discordName = discordUser ? discordUser.username : usuario;

        if (discordUser && discordUser.avatar) {
            avatarHtml = `<img style="width: 38px; height: 38px; border-radius: 50%; border: 2px solid var(--accent-blue);" src="https://cdn.discordapp.com/avatars/${discordUser.id}/${discordUser.avatar}.png">`;
        }

        document.getElementById('user-status-box').innerHTML = `
            <div style="display: flex; align-items: center; gap: 12px;">
                ${avatarHtml}
                <div>
                    <div style="font-size: 11px; color: var(--text-muted);">Usuário: <strong>${usuario}</strong></div>
                    <strong style="font-size: 13px; color: #fff;">${discordName}</strong> <br>
                    <span style="color:var(--accent-gold); font-size:11px;">(${cargo})</span>
                </div>
            </div>
        `;

        // Se for Delegado ou Administrador Geral, libera o painel administrativo na sidebar
        if (cargo === "Delegado" || cargo === "Delegado Adjunto" || cargo === "Administrador Geral") {
            document.getElementById('painel-gerenciamento').style.display = 'block';
            popularSelectUsuarios();
        }
    }

    function popularSelectUsuarios(filtro = "") {
        const select = document.getElementById('admin-select-user');
        select.innerHTML = "";
        
        for (let user in cacheUsuariosGlobal) {
            if (user.toLowerCase().includes(filtro.toLowerCase())) {
                let opt = document.createElement('option');
                opt.value = user;
                opt.text = `${user} — [${cacheUsuariosGlobal[user].cargo}]`;
                select.appendChild(opt);
            }
        }
    }

    function filtrarUsuariosSelect() {
        const termo = document.getElementById('admin-search-user').value;
        popularSelectUsuarios(termo);
    }

    function preencherCargoAlvo() {
        const select = document.getElementById('admin-select-user');
        const userSelecionado = select.value;
        if (userSelecionado && cacheUsuariosGlobal[userSelecionado]) {
            document.getElementById('admin-novo-cargo').value = cacheUsuariosGlobal[userSelecionado].cargo;
        }
    }

    async function salvarAlteracaoCargo() {
        const adminUser = sessionStorage.getItem('usuario_logado');
        const alvoUsuario = document.getElementById('admin-select-user').value;
        const novoCargo = document.getElementById('admin-novo-cargo').value;
        const adminSenha = document.getElementById('admin-confirm-pass').value.trim();
        const errorBox = document.getElementById('admin-error');
        const successBox = document.getElementById('admin-success');

        errorBox.style.display = 'none';
        successBox.style.display = 'none';

        if (!alvoUsuario || !adminSenha) {
            errorBox.innerText = "Selecione um usuário e digite sua senha para confirmar.";
            errorBox.style.display = 'block';
            return;
        }

        successBox.innerText = "Salvando alteração na planilha...";
        successBox.style.display = 'block';

        try {
            const response = await fetch(GOOGLE_SCRIPT_URL, {
                method: 'POST',
                body: JSON.stringify({
                    action: 'atualizar_cargo',
                    adminUser: adminUser,
                    adminSenha: adminSenha,
                    alvoUsuario: alvoUsuario,
                    novoCargo: novoCargo
                })
            });
            const resultado = await response.json();

            if (resultado.status === 'sucesso') {
                successBox.innerText = "Cargo atualizado com sucesso!";
                cacheUsuariosGlobal[alvoUsuario].cargo = novoCargo;
                popularSelectUsuarios();
                document.getElementById('admin-confirm-pass').value = "";
                setTimeout(() => { successBox.style.display = 'none'; }, 3000);
            } else {
                successBox.style.display = 'none';
                errorBox.innerText = resultado.mensagem || "Erro ao atualizar cargo.";
                errorBox.style.display = 'block';
            }
        } catch (err) {
            successBox.style.display = 'none';
            errorBox.innerText = "Erro de conexão ao salvar.";
            errorBox.style.display = 'block';
        }
    }

    function sairSistema() {
        sessionStorage.clear();
        window.location.hash = "";
        window.location.href = window.location.pathname;
    }
</script>
</body>
</html>
